<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Khalid Mubarek - Senior Video Editor & Social Media Strategist | 4+ Years Crafting Visual Stories" />
    <meta name="theme-color" content="#0a0908" />
    <title>Khalid Mubarek | Video Editor & Social Media Strategist</title>
    <script>
      // Apply saved theme before first paint to avoid a flash
      try {
        const saved = localStorage.getItem('theme')
        document.documentElement.classList.add(saved === 'light' ? 'light' : 'dark')
      } catch (_) {
        document.documentElement.classList.add('dark')
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body class="h-full antialiased">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
